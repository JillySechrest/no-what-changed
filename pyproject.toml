[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "no-what-changed"
version = "0.1.0"
description = "Reads a merged PR's diff and opens a PR that adds an honest CHANGELOG.md entry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nwc = "nwc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
